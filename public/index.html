<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Airtel Money Tchad - Crédit Rapide</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: -apple-system, sans-serif;
            background-color: #f1f3f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-header {
            width: 100%;
            background: linear-gradient(to bottom, #ff0000, #cc0000); /* Airtel Red Branding */
            padding: 20px 20px 40px;
            color: white;
            font-size: 24px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            box-sizing: border-box;
        }

        .card {
            background: white;
            width: 92%;
            max-width: 450px;
            margin-top: -25px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            box-sizing: border-box;
        }

        h2 {
            font-size: 22px;
            color: #333;
            margin: 0 0 5px;
            text-align: center;
        }

        .subtext {
            font-size: 11px;
            color: #888;
            text-align: center;
            margin-bottom: 25px;
        }

        /* Currency Indicator Styles */
        .currency-badge {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffe6e6;
            color: #ff0000;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 25px;
            font-weight: bold;
            font-size: 14px;
        }

        .slider-section { margin-bottom: 25px; }

        .slider-header {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            font-size: 14px;
            color: #444;
        }

        .red-text { color: #ff0000; font-weight: bold; }

        input[type=range] {
            width: 100%;
            accent-color: #ff0000;
            margin: 15px 0;
            height: 6px;
        }

        .slider-footer {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #bbb;
        }

        .result-container {
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            margin: 25px 0;
        }

        .result-value {
            color: #ff0000;
            font-size: 28px;
            font-weight: bold;
            margin: 0;
        }

        .btn-apply {
            background: linear-gradient(to right, #ff0000, #e60000);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            font-size: 11px;
            color: #ccc;
            margin: 30px 0;
        }
    </style>
</head>

<body>

<div class="app-header">
    <span>Airtel Money Tchad</span>
    <span>☰</span>
</div>

<div class="card">
    <h2>Obtenir un Prêt Rapide</h2>
    <div class="subtext">Approbation immédiate • Taux compétitif • Remboursement flexible</div>

    <!-- Currency Display (FCFA) -->
    <div class="currency-badge">
        <span>Devise: Franc CFA (FCFA)</span>
    </div>

    <!-- Loan Amount Slider -->
    <div class="slider-section">
        <div class="slider-header">
            <span>Montant du Prêt</span>
            <span id="valAmt" class="red-text">50.000 FCFA</span>
        </div>
        <input type="range" id="amt" min="10000" max="500000" step="5000" value="50000">
        <div class="slider-footer">
            <span id="minAmtLabel">10.000 FCFA</span>
            <span id="maxAmtLabel">500.000 FCFA</span>
        </div>
    </div>

    <!-- Repayment Months Slider -->
    <div class="slider-section">
        <div class="slider-header">
            <span>Durée de Remboursement</span>
            <span id="valDur" class="red-text">3 mois</span>
        </div>
        <input type="range" id="dur" min="1" max="12" step="1" value="3">
        <div class="slider-footer"><span>1 mois</span><span>12 mois</span></div>
    </div>

    <!-- Monthly Payment Summary Display -->
    <div class="result-container">
        <p style="margin:0; font-size:14px; color:#666">Remboursement Mensuel</p>
        <p id="monthly" class="result-value">18.667 FCFA</p>
    </div>

    <button class="btn-apply" onclick="goToPage2()">POSTULER MAINTENANT</button>
</div>

<div class="footer">© 2026 Airtel Money Tchad</div>

<script>
    const currentCurrency = 'FCFA';

    function update() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        const amount = Number(amtEl.value) || 0;
        const duration = Number(durEl.value) || 1;

        // Visual format values
        document.getElementById('valAmt').innerText = `${amount.toLocaleString('fr-FR')} FCFA`;
        document.getElementById('valDur').innerText = `${duration} mois`;

        // Interactive simulation estimation equation logic (12% interest premium factor)
        const monthly = (amount * 1.12) / duration;
        document.getElementById('monthly').innerText = `${Math.round(monthly).toLocaleString('fr-FR')} FCFA`;
    }

    function goToPage2() {
        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (!amtEl || !durEl) return;

        localStorage.setItem('amount', amtEl.value);
        localStorage.setItem('currency', currentCurrency);
        localStorage.setItem('loanDuration', durEl.value + " Mois");

        window.location.href = "/page2";
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const amtEl = document.getElementById('amt');
        const durEl = document.getElementById('dur');

        if (amtEl) amtEl.addEventListener('input', update);
        if (durEl) durEl.addEventListener('input', update);

        update();
    };
</script>

</body>
</html>
